1. Fungsi LABEL di Dockerfile

LABEL maintainer="you@example.com" \
     version="1.0" \
      description="Microservice License service based on Red Hat UBI"

Apa itu?
LABEL adalah cara memberi metadata pada Docker image.

Tujuannya:
Memberikan informasi tambahan untuk dokumentasi image.

Membantu tools CI/CD, registry, atau automation pipeline mengenali image.

Bisa dipakai dalam searching/filtering di registry:  docker image inspect license-service

LABEL	Manfaat
maintainer	Menunjukkan siapa yang bertanggung jawab jika ada masalah pada image.
version	Menandai versi logic aplikasi atau kontainer. Bisa dipakai untuk rollback.
description	Menjelaskan isi image (berguna di tim besar & registry image browser).  

