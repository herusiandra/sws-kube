⚠️ Catatan Penting
Jangan buat PV/PVC manual jika pakai StatefulSet + volumeClaimTemplates.

Jika cluster Anda tidak punya StorageClass default, Anda harus buat StorageClass dulu, atau akan tetap Pending.

