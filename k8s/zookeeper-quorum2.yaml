apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-myid
  namespace: sws-fels
data:
  zookeeper-0: |
    1
  zookeeper-1: |
    2
  zookeeper-2: |
    3
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-headless
  namespace: sws-fels
  labels:
    app: zookeeper
spec:
  ports:
    - port: 2181
      name: client
    - port: 2888
      name: follower
    - port: 3888
      name: election
  clusterIP: None
  selector:
    app: zookeeper
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: sws-fels
spec:
  serviceName: zookeeper-headless
  replicas: 3
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: bitnami/zookeeper:latest
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: follower
            - containerPort: 3888
              name: election
          env:
            - name: ALLOW_ANONYMOUS_LOGIN
              value: "yes"
            - name: ZOO_SERVERS
              value: "zookeeper-0.zookeeper-headless.sws-fels.svc.cluster.local:2888:3888;zookeeper-1.zookeeper-headless.sws-fels.svc.cluster.local:2888:3888;zookeeper-2.zookeeper-headless.sws-fels.svc.cluster.local:2888:3888"
          volumeMounts:
            - name: data
              mountPath: /bitnami/zookeeper
            - name: myid
              mountPath: /bitnami/zookeeper/data/myid
              subPath: myid
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 1Gi
