git add:
 git add .

Cek status sekarang:
 git status

Kalau kamu sudah git add ., lanjut:
 git commit -m "Initial commit"

 Jika kamu mau pakai branch master:
 - git branch -M master
 - git push -u origin master

Atau kalau kamu mau pakai main:
 - git branch -M main
 - git push -u origin main

Log:
 git log --oneline

#setelah merubah sesuatu pada file dalam git
habis rubah sesuatu:
  - git status
  - git add .
  - git commit -m "command nya"
  - git rebase --continue   //jika conflik  ex git pull --rebase origin sws-fels
  - git push -u origin sws-fels


commadn yang lain yang bisa di gunakan:
 git add
 git commit -m "hapus file jar"   atau
 git commit --amend --no-edit
 git push origin master
 git push origin master


#Buat Branch Baru
Contoh membuat branch baru bernama main:
  git checkout -b sws-fels

Push Branch Baru ke Remote:
  git push -u origin sws-fels
#-u = set upstream, supaya ke depannya kamu cukup git push saja tanpa perlu sebut nama branch.
#origin = remote name default untuk GitHub.

sws-fels = nama branch lokal kamu.
check branch aktif:
  git branch
  
Cek semua branch remote:
  git branch -r


